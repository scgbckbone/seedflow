<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090906">
    <meta
      name="description"
      content="A source-linked map of COLDCARD seed generation for Mk4/Mk5 firmware 5.6.1 and later and Q firmware 1.5.1Q and later."
    >
    <title>COLDCARD Seed Generation · Firmware ≥5.6.1 / ≥1.5.1Q</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="identity-bar">
      <div class="identity-title">
        <img
          class="identity-brand"
          src="coldcard-logo.svg"
          width="154"
          height="22"
          alt="COLDCARD"
        >
        <div
          class="firmware-scope"
          aria-label="Firmware scope: Mk4 and Mk5 version 5.6.1 and later; Q version 1.5.1Q and later"
        >
          <span class="firmware-scope-label">FIRMWARE</span>
          <span class="firmware-versions">
            <strong>MK4 / MK5 ≥ 5.6.1</strong>
            <strong>Q ≥ 1.5.1Q</strong>
          </span>
        </div>
      </div>

      <a
        class="security-advisory"
        href="https://coldcard.com/security/status"
        target="_blank"
        rel="noreferrer"
        aria-label="Read the official Coldcard security advisory and seed migration guidance"
      >
        <span class="security-advisory-copy">
          <strong>SECURITY ADVISORY</strong>
          <span>Existing affected seeds require migration</span>
        </span>
        <span class="security-advisory-arrow" aria-hidden="true">↗</span>
      </a>
    </header>

    <main class="graph-viewport">
      <h1 class="visually-hidden">COLDCARD Seed Generation</h1>
      <svg
        id="seed-graph"
        class="seed-graph"
        viewBox="0 0 1600 900"
        role="img"
        aria-labelledby="graph-title graph-description"
      >
        <title id="graph-title">
          COLDCARD seed generation source map for Mk4 and Mk5 firmware 5.6.1 and later and Q firmware 1.5.1Q and later
        </title>
        <desc id="graph-description">
          An unofficial technical data-flow graph for current COLDCARD seed generation. Every node opens its implementation source.
        </desc>
      </svg>

      <noscript>
        <a class="noscript-source" href="https://github.com/Coldcard/firmware/blob/master/shared/seed.py">
          Coldcard/firmware · shared/seed.py ↗
        </a>
      </noscript>
    </main>
  </body>
</html>
