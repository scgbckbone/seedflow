<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090906">
    <meta
      name="description"
      content="A source-linked technical graph of COLDCARD seed generation."
    >
    <title>COLDCARD seed source map</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="graph-viewport">
      <svg
        id="seed-graph"
        class="seed-graph"
        viewBox="0 0 1600 900"
        role="img"
        aria-labelledby="graph-title graph-description"
      >
        <title id="graph-title">COLDCARD seed generation source map</title>
        <desc id="graph-description">
          A technical data-flow graph. Every node opens its implementation source.
        </desc>
      </svg>

      <a
        id="source-peek"
        class="source-peek"
        href="https://github.com/Coldcard/firmware/blob/master/shared/seed.py"
        target="_blank"
        rel="noreferrer"
      >
        <span id="source-kind">SOURCE</span>
        <code id="source-path">Coldcard/firmware · shared/seed.py</code>
        <span aria-hidden="true">↗</span>
      </a>

      <noscript>
        <a class="noscript-source" href="https://github.com/Coldcard/firmware/blob/master/shared/seed.py">
          Coldcard/firmware · shared/seed.py ↗
        </a>
      </noscript>
    </main>
  </body>
</html>
